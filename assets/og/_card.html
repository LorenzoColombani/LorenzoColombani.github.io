<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card</title>
<style>
/* The site's own faces, loaded straight from the site's own files, so a card
   cannot drift away from the page it advertises. */
@font-face{font-family:'Playfair Display';src:url('/assets/fonts/playfair-display-v40-latin-600.woff2') format('woff2');font-weight:600;font-display:block}
@font-face{font-family:'DM Sans';src:url('/assets/fonts/dm-sans-v17-latin-regular.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'JetBrains Mono';src:url('/assets/fonts/jbmono-400.woff2') format('woff2');font-weight:400;font-display:block}

:root{
  --stage:#0B0A10; --surface:#14121B; --ivory:#ECE7DD; --dim:#9C96A8;
  --gold:#D4A574; --hairline:rgba(236,231,221,.10); --gold-line-hi:rgba(212,165,116,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  background:var(--stage); color:var(--ivory);
  font-family:'DM Sans',system-ui,sans-serif;
  display:grid; grid-template-columns:1fr 1fr; align-items:center;
  position:relative; overflow:hidden;
}
/* the site's vignette, so the card sits in the same room as the page */
body::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 90% 80% at 50% 45%,transparent 42%,rgba(4,3,8,.42) 78%,rgba(3,2,6,.78) 100%);
}
.left{padding:64px 0 64px 72px; display:flex; flex-direction:column; gap:22px; position:relative; z-index:2}
.kicker{
  font:400 17px/1 'JetBrains Mono',monospace; letter-spacing:.30em;
  text-transform:uppercase; color:var(--gold);
}
h1{
  font-family:'Playfair Display',Georgia,serif; font-weight:600;
  font-size:74px; line-height:1.04; letter-spacing:-.015em; max-width:14ch;
}
h1.long{font-size:60px}
.deck{font-size:23px; line-height:1.45; color:var(--dim); max-width:26ch}
.sig{
  margin-top:auto; display:flex; align-items:center; gap:14px;
  font:400 16px/1 'JetBrains Mono',monospace; letter-spacing:.22em;
  text-transform:uppercase; color:var(--dim);
}
.mark{
  width:34px; height:34px; border-radius:5px; background:var(--gold);
  color:#0B0A10; display:grid; place-items:center;
  font:400 15px/1 'JetBrains Mono',monospace; letter-spacing:.04em;
}
/* the still, framed the way the site frames a screen */
.right{position:relative; height:100%; display:grid; place-items:center; padding:56px 56px 56px 24px}
.screen{
  width:100%; aspect-ratio:16/10; border-radius:10px; overflow:hidden;
  background:var(--surface); box-shadow:inset 0 0 0 1px var(--hairline), 0 30px 70px rgba(0,0,0,.55);
}
.screen img{width:100%; height:100%; object-fit:cover; object-position:top center; display:block}
/* one gold hairline down the seam, the site's own accent */
.seam{position:absolute; left:0; top:64px; bottom:64px; width:1px; background:linear-gradient(to bottom,transparent,var(--gold-line-hi),transparent)}
</style>
</head>
<body>
  <div class="left">
    <p class="kicker" id="kicker">Case study</p>
    <h1 id="title">Title</h1>
    <p class="deck" id="deck">Deck</p>
    <p class="sig"><span class="mark">LC</span> lorenzocolombani.com</p>
  </div>
  <div class="right">
    <span class="seam"></span>
    <div class="screen"><img id="still" alt=""></div>
  </div>
</body>
</html>
